[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glean"
dynamic = ["version"]
description = "Grounded Linked Evidence And Notes — an LLM-maintained research wiki with provenance by construction"
readme = "README.md"
license = { text = "GNU General Public License v3 (GPLv3)" }
authors = [{ name = "Stefano Zaghi", email = "stefano.zaghi@gmail.com" }]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "typer>=0.9.0,<2.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "pydantic>=2.6",
  "rich>=13.0",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0", "pymupdf4llm>=0.0.10"]
web = ["markdownify>=0.11", "beautifulsoup4>=4.12"]
cloud = ["anthropic>=0.40"]
dev = ["build", "twine", "ruff", "pytest", "pytest-cov", "pytest-mock", "git-cliff"]

[project.scripts]
glean = "glean.cli:app"

[project.urls]
Homepage = "https://github.com/szaghi/GLEAN"

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = []

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF", "S", "C4", "PTH"]
ignore = [
  "E501",   # line too long — handled by formatter
  "B008",   # function-call in argument default — required idiom for typer.Argument / typer.Option
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=glean --cov-report=term-missing"

[tool.coverage.run]
source = ["glean"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 60
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]

[tool.setuptools.dynamic]
version = { attr = "glean.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["glean*"]

[tool.setuptools.package-data]
"glean.prompts" = ["*.txt", "*.md"]
